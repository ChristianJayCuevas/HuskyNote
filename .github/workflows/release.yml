name: Release Application Binaries

# Builds Windows, macOS, and Linux from the tagged commit and publishes one
# GitHub release with every download, checksums, and the changelog entry as
# its notes. Push a tag such as v0.5.0 that matches package.json.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag matching package.json (e.g. v0.5.0)'
        required: true

permissions:
  contents: write

jobs:
  # A release can also be published by hand with files built locally (v0.7.0 was). Then the tag
  # that release creates must not rebuild and replace those files, so everything below is skipped
  # when the release for this tag already has assets.
  existing:
    name: Check for an already published release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Look for the release and its assets
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          count=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          echo "Release $TAG has $count asset(s)"
          if [ "$count" -gt 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $TAG is already published with its files; skipping the build so they are not replaced."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Build Windows App & Installer
    needs: existing
    if: needs.existing.outputs.published != 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application & Desktop Installer
        run: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1

      - name: Upload Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: huskynote-windows
          path: |
            public/downloads/HuskyNote-Setup-x64.exe
            public/downloads/HuskyNote-Windows-Portable.zip
            public/downloads/HuskyNote-Setup.bat
          if-no-files-found: error

  macos:
    name: Build macOS App
    needs: existing
    if: needs.existing.outputs.published != 'true'
    uses: ./.github/workflows/build-macos.yml

  linux:
    name: Build Linux App
    needs: existing
    if: needs.existing.outputs.published != 'true'
    uses: ./.github/workflows/build-linux.yml

  publish:
    name: Publish GitHub Release
    needs: [existing, windows, macos, linux]
    if: needs.existing.outputs.published != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate Checksums and Release Notes
        env:
          TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          node scripts/release-notes.mjs "$TAG" > release-notes.md
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: HuskyNote ${{ github.event.inputs.tag_name || github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*

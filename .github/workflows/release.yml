name: Release Application Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release-windows:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application & Desktop Installer
        run: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1

      - name: Generate Checksums
        run: |
          Set-Location public\downloads
          Get-FileHash -Algorithm SHA256 HuskyNote-Setup-x64.exe, HuskyNote-Windows-Portable.zip, HuskyNote-Setup.bat | 
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | 
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: HuskyNote ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            public/downloads/HuskyNote-Setup-x64.exe
            public/downloads/HuskyNote-Windows-Portable.zip
            public/downloads/HuskyNote-Setup.bat
            public/downloads/HuskyNote-macOS-Universal.dmg
            public/downloads/HuskyNote-macOS-arm64.dmg
            public/downloads/HuskyNote-macOS-x64.dmg
            public/downloads/SHA256SUMS.txt
